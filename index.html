<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程开机控制面板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;
  --text:#e4e6eb;--text-dim:#8b8fa3;
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-glow:rgba(59,130,246,.25);
  --success:#22c55e;--success-glow:rgba(34,197,94,.15);
  --warn:#f59e0b;--warn-glow:rgba(245,158,11,.15);
  --error:#ef4444;--error-glow:rgba(239,68,68,.15);
  --radius:12px;
}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.container{
  width:100%;max-width:520px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:40px 32px;display:flex;flex-direction:column;gap:28px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.header{text-align:center}
.header h1{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:1.5rem;font-weight:700;letter-spacing:-.02em;
}
.header h1 .icon-bolt{width:28px;height:28px;fill:var(--warn)}
.header p{color:var(--text-dim);font-size:.875rem;margin-top:6px}

.config{display:flex;flex-direction:column;gap:8px}
.config label{font-size:.8rem;color:var(--text-dim);font-weight:500}
.config input{
  width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:.875rem;outline:none;
  transition:border-color .2s;
}
.config input:focus{border-color:var(--accent)}

.power-btn{
  position:relative;width:100%;padding:16px;border:none;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-size:1.1rem;font-weight:600;
  cursor:pointer;transition:all .25s;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.power-btn:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.power-btn:active:not(:disabled){transform:translateY(0)}
.power-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.power-btn .spinner-svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.status-box{
  border-radius:var(--radius);padding:20px;text-align:center;
  border:1px solid var(--border);background:var(--bg);
  transition:border-color .3s,background .3s;
}
.status-box.idle{border-color:var(--border);background:var(--bg)}
.status-box.pending{border-color:var(--accent);background:rgba(59,130,246,.06)}
.status-box.success{border-color:var(--success);background:var(--success-glow)}
.status-box.warn{border-color:var(--warn);background:var(--warn-glow)}
.status-box.error{border-color:var(--error);background:var(--error-glow)}
.status-icon{display:flex;justify-content:center;margin-bottom:8px}
.status-icon svg{width:32px;height:32px}
.status-text{font-size:.95rem;font-weight:500;line-height:1.5}
.status-detail{font-size:.8rem;color:var(--text-dim);margin-top:6px}

.divider{height:1px;background:var(--border);border:none}

.remote-section{display:flex;flex-direction:column;gap:16px}
.remote-section h2{
  display:flex;align-items:center;gap:8px;
  font-size:1.1rem;font-weight:600;
}
.remote-section h2 svg{width:22px;height:22px;fill:var(--accent)}

.info-grid{display:flex;flex-direction:column;gap:12px}
.info-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--border);
}
.info-item .info-label{font-size:.8rem;color:var(--text-dim);font-weight:500;white-space:nowrap}
.info-item .info-value{
  font-size:.875rem;font-weight:600;color:var(--text);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  user-select:all;cursor:text;
}

.copy-btn{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.75rem;
  margin-left:8px;transition:all .2s;white-space:nowrap;
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--success);color:var(--success)}

.remote-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500;
  transition:color .2s;
}
.remote-link:hover{color:var(--accent-hover);text-decoration:underline}
.remote-link svg{width:14px;height:14px;fill:currentColor}

.tip{font-size:.8rem;color:var(--text-dim);line-height:1.6}
.tip code{
  background:var(--bg);padding:2px 6px;border-radius:4px;
  font-size:.75rem;font-family:"SFMono-Regular",Consolas,monospace;color:var(--warn);
}

.footer{text-align:center;font-size:.75rem;color:var(--text-dim)}

@media(max-width:520px){
  .container{padding:28px 20px}
  .header h1{font-size:1.25rem}
  .header h1 .icon-bolt{width:22px;height:22px}
  .info-item{flex-direction:column;align-items:flex-start;gap:4px}
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>
      <svg class="icon-bolt" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      远程开机控制面板
    </h1>
    <p>向远程服务发送开机指令</p>
  </div>

  <div class="config" style="display:none">
    <label for="apiUrl">后端地址</label>
    <input type="text" id="apiUrl" value="https://tax-gained-rolls-analyses.trycloudflare.com/start_vm" placeholder="输入后端 API 地址">
  </div>

  <button class="power-btn" id="powerBtn" onclick="sendStart()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    开机
  </button>

  <div class="status-box idle" id="statusBox">
    <div class="status-icon" id="statusIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="status-text" id="statusText">等待指令</div>
    <div class="status-detail" id="statusDetail"></div>
  </div>

  <hr class="divider">

  <div class="remote-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      云电脑远程连接
    </h2>

    <p class="tip">云电脑使用 <code>UU远程</code> 进行连接。下载并安装 <a class="remote-link" href="https://uuyc.163.com/" target="_blank" rel="noopener">网易UU远程<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a> 即可对我发起远程协助。</p>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">设备ID</span>
        <span class="info-value">
          <span id="deviceID">722476855</span>
          <button class="copy-btn" onclick="copyText('deviceID', this)">复制</button>
        </span>
      </div>
      <div class="info-item">
        <span class="info-label">设备验证码</span>
        <span class="info-value">
          <span id="deviceCode">bilibili2233</span>
          <button class="copy-btn" onclick="copyText('deviceCode', this)">复制</button>
        </span>
      </div>
    </div>
  </div>

  <div class="footer">远程开机 &middot; 仅发送网络请求，不执行本地操作</div>
</div>

<script>
var btn = document.getElementById('powerBtn');
var statusBox = document.getElementById('statusBox');
var statusIcon = document.getElementById('statusIcon');
var statusText = document.getElementById('statusText');
var statusDetail = document.getElementById('statusDetail');
var apiUrlInput = document.getElementById('apiUrl');

var svgIcons = {
  idle: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  pending: '<svg class="spinner-svg" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>',
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  unknown: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  timeout: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
};

function setStatus(type, text, detail) {
  statusBox.className = 'status-box ' + type;
  statusIcon.innerHTML = svgIcons[type] || svgIcons.idle;
  statusText.textContent = text;
  statusDetail.textContent = detail || '';
}

function copyText(elementId, btnEl) {
  var text = document.getElementById(elementId).textContent;
  navigator.clipboard.writeText(text).then(function () {
    btnEl.textContent = '已复制';
    btnEl.classList.add('copied');
    setTimeout(function () {
      btnEl.textContent = '复制';
      btnEl.classList.remove('copied');
    }, 2000);
  });
}

function sendStart() {
  var url = apiUrlInput.value.trim();
  if (!url) {
    setStatus('error', '地址不能为空', '请输入有效的后端 API 地址');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<svg class="spinner-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>发送中&hellip;';
  setStatus('pending', '已发送请求', '正在连接 ' + url);

  var controller = new AbortController();
  var timeoutId = setTimeout(function () { controller.abort(); }, 10000);

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: controller.signal
  })
  .then(function (res) {
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    return res.json();
  })
  .then(function (data) {
    if (data.status === 'success') {
      setStatus('success', '虚拟机已成功启动', data.message || '');
    } else if (data.status === 'already_running') {
      setStatus('warn', '虚拟机已在运行', data.message || '');
    } else if (data.status === 'failed') {
      setStatus('error', '启动失败', data.message || '后端返回 failed');
    } else {
      setStatus('unknown', '未知响应', JSON.stringify(data));
    }
  })
  .catch(function (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') {
      setStatus('timeout', '请求超时', '服务器在 10 秒内未响应');
    } else {
      setStatus('error', '网络错误', err.message);
    }
  })
  .finally(function () {
    btn.disabled = false;
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>开机';
  });
}
</script>
</body>
</html>
